name: Build Android APK

# Builds only when started by hand (Actions > Build Android APK > Run workflow), never on a
# push or pull request: an APK is built only when the owner asks for one.
# Built from `main`, it is the normal release `v<version>`. Built from any other branch (e.g.
# `trailers`), it is a separate test release `v<version>-<branch>`, marked as a pre-release, so
# it never replaces or shows up as the latest normal one.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to publish the APK as a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Android SDK pieces Godot checks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Signing key and Godot editor settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using the fixed signing key from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            PASS="$KS_PASS"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set: generating a throwaway key (see SIGNING.md)"
            PASS=android
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass "$PASS" \
              -keystore "$RUNNER_TEMP/debug.keystore" -storepass "$PASS" \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "$PASS"
          SETTINGS

      - name: Stamp version
        run: |
          VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)
          NUMS=$(echo "$VERSION" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+')   # 2.13.0-b388 -> 2.13.0
          IFS=. read -r MAJOR MINOR PATCH <<< "$NUMS"
          CODE=$((MAJOR * 100000 + MINOR * 1000 + PATCH * 10))   # 2.13.0 -> 213000 (above every older code)
          sed -i "s|^version/name=.*|version/name=\"$VERSION\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=$CODE|" export_presets.cfg
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            SUFFIX=""
          else
            SUFFIX="-$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9.\n' '-' | sed 's/-*$//')"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi
          echo "APK_NAME=shardsight-v$VERSION$SUFFIX" >> "$GITHUB_ENV"
          echo "Version $VERSION (code $CODE)"

      - name: Import and export debug APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" "build/$APK_NAME.apk"

      # Kept 3 days (so old builds don't fill the artifact storage); if the storage is full anyway,
      # the build carries on to publishing instead of stopping here.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.APK_NAME }}
          path: build/${{ env.APK_NAME }}.apk
          retention-days: 3

      # A release build (no debug overhead), signed with the same fixed key. Only when the key
      # secrets are set (see SIGNING.md); without them every build would get a different key.
      - name: Export signed release APK
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: godot --headless --export-release "Android" "build/$APK_NAME-release.apk"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        with:
          name: ${{ env.APK_NAME }}-release
          path: build/${{ env.APK_NAME }}-release.apk
          retention-days: 3

      # The APK goes to the repository's Releases (tag v<version>), which don't use the Actions
      # artifact storage: a permanent download link per version. Published straight after the
      # export (no test runs); building the same version again replaces its APK.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${APK_NAME#shardsight-}"
          FILES="build/$APK_NAME.apk"
          if [ -f "build/$APK_NAME-release.apk" ]; then FILES="$FILES build/$APK_NAME-release.apk"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "Shardsight $TAG (test build from $GITHUB_REF_NAME)" \
              --prerelease --latest=false \
              --notes "Test APK built from the $GITHUB_REF_NAME branch ($GITHUB_SHA). Not a normal release."
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "Shardsight $TAG" \
              --notes "Android APK built from $GITHUB_SHA. See CHANGELOG.md for what changed."
          fi
          echo "APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
