name: Build Android APK

# Builds only when started by hand (Actions > Build Android APK > Run workflow), never on a
# push or pull request: an APK is built only when the owner asks for one.
on:
  workflow_dispatch:
    inputs:
      playtest_minutes:
        description: "Play-test length in game-minutes"
        default: "15"

env:
  GODOT_VERSION: 4.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to publish the APK as a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Android SDK pieces Godot checks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Signing key and Godot editor settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using the fixed signing key from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            PASS="$KS_PASS"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set: generating a throwaway key (see SIGNING.md)"
            PASS=android
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass "$PASS" \
              -keystore "$RUNNER_TEMP/debug.keystore" -storepass "$PASS" \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "$PASS"
          SETTINGS

      - name: Stamp version
        run: |
          VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))   # 0.5.0 -> 500
          sed -i "s|^version/name=.*|version/name=\"$VERSION\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=$CODE|" export_presets.cfg
          echo "APK_NAME=shardsight-v$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION (code $CODE)"

      - name: Import and export debug APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" "build/$APK_NAME.apk"

      # Kept 3 days (so old builds don't fill the artifact storage); if the storage is full anyway,
      # the build carries on to the smoke test instead of stopping here.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.APK_NAME }}
          path: build/${{ env.APK_NAME }}.apk
          retention-days: 3

      # A release build (no debug overhead), signed with the same fixed key. Only when the key
      # secrets are set (see SIGNING.md); without them every build would get a different key.
      - name: Export signed release APK
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: godot --headless --export-release "Android" "build/$APK_NAME-release.apk"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        with:
          name: ${{ env.APK_NAME }}-release
          path: build/${{ env.APK_NAME }}-release.apk
          retention-days: 3

      # Godot packages scripts even when they contain errors, so a green export alone proves
      # little. Run the game headless for a while and fail on any script error.
      - name: Smoke test (run the game headless, fail on script errors)
        run: |
          set +e
          timeout 120 godot --headless --quit-after 1800 > smoke.log 2>&1
          code=$?
          set -e
          echo "godot exited with $code"
          tail -n 40 smoke.log
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" smoke.log; then
            echo "::error::Script errors while running the game (see above)"
            exit 1
          fi

      # The APK goes to the repository's Releases (tag v<version>), which don't use the Actions
      # artifact storage: a permanent download link per version. Published once the smoke test has
      # shown the game starts; building the same version again replaces its APK.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${APK_NAME#shardsight-}"
          FILES="build/$APK_NAME.apk"
          if [ -f "build/$APK_NAME-release.apk" ]; then FILES="$FILES build/$APK_NAME-release.apk"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "Shardsight $TAG" \
              --notes "Android APK built from $GITHUB_SHA. See CHANGELOG.md for what changed."
          fi
          echo "APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # A longer automated play: a fresh game in Auto mode for 15 game-minutes (fixed 20 fps,
      # as fast as the runner allows). Fails if the hero never fights, loots or improves, if
      # anyone ends up inside a wall, or on any script error.
      - name: Play-test (Auto mode; 15 game-minutes unless set when run by hand)
        env:
          PLAYTEST_MINUTES: ${{ github.event.inputs.playtest_minutes || '15' }}
        run: |
          set +e
          SECS=$(( PLAYTEST_MINUTES * 60 ))
          FRAMES=$(( SECS * 20 + 2000 ))
          echo "Play-testing $PLAYTEST_MINUTES game-minutes ($FRAMES frames max)"
          timeout 3000 godot --headless --fixed-fps 20 --quit-after $FRAMES -- --autotest --autotest-seconds=$SECS > playtest.log 2>&1
          code=$?
          set -e
          echo "godot exited with $code"
          grep -E "AUTOTEST" playtest.log || true
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" playtest.log; then
            echo "::error::Script errors during the play-test (see above)"
            exit 1
          fi
          if grep -q "AUTOTEST FAIL" playtest.log || ! grep -q "AUTOTEST PASS" playtest.log; then
            echo "::error::The play-test failed or did not finish"
            tail -n 60 playtest.log
            exit 1
          fi
