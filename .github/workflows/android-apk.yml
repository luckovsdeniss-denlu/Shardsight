name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Android SDK pieces Godot checks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Signing key and Godot editor settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using the fixed signing key from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            PASS="$KS_PASS"
          else
            echo "No signing secrets set: generating a throwaway key (see SIGNING.md)"
            PASS=android
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass "$PASS" \
              -keystore "$RUNNER_TEMP/debug.keystore" -storepass "$PASS" \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "$PASS"
          SETTINGS

      - name: Stamp version
        run: |
          VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))   # 0.5.0 -> 500
          sed -i "s|^version/name=.*|version/name=\"$VERSION\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=$CODE|" export_presets.cfg
          echo "APK_NAME=shardsight-v$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION (code $CODE)"

      - name: Import and export debug APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" "build/$APK_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/${{ env.APK_NAME }}.apk

      # Godot packages scripts even when they contain errors, so a green export alone proves
      # little. Run the game headless for a while and fail on any script error.
      - name: Smoke test (run the game headless, fail on script errors)
        run: |
          set +e
          timeout 120 godot --headless --quit-after 1800 > smoke.log 2>&1
          code=$?
          set -e
          echo "godot exited with $code"
          tail -n 40 smoke.log
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" smoke.log; then
            echo "::error::Script errors while running the game (see above)"
            exit 1
          fi
