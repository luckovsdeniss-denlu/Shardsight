  <line x1="195.2" y1="60.8" x2="197.7" y2="58.3" stroke="#e8c870" stroke-width="1.0" opacity="0.6"/>
  <line x1="203.4" y1="70.2" x2="206.1" y2="68.0" stroke="#e8c870" stroke-width="1.0" opacity="0.6"/>
