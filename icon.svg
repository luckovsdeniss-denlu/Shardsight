<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#22304f"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </radialGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.5" stop-color="#4fa3e8"/>
      <stop offset="1" stop-color="#1d4f9c"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#9aa3b2"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- a gold ring, centred on the icon, all the way round the shard and the sword -->
  <circle cx="128" cy="128" r="106" fill="none" stroke="#7a5a18" stroke-width="10" opacity="0.6"/>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#d9b44a" stroke-width="6"/>
  <g transform="translate(128 128) scale(0.84) translate(-128 -129)">
  <!-- the shard: a faceted crystal -->
  <polygon points="128,30 176,104 150,206 106,206 80,104" fill="url(#shard)"/>
  <polygon points="128,30 150,104 128,206 106,104" fill="#e8f6ff" opacity="0.35"/>
  <polygon points="80,104 128,30 106,104" fill="#ffffff" opacity="0.25"/>
  <!-- the sword in front of it -->
  <polygon points="122,58 134,58 134,176 128,190 122,176" fill="url(#blade)" stroke="#5b6270" stroke-width="2"/>
  <rect x="98" y="172" width="60" height="11" rx="4" fill="#d9b44a" stroke="#7a5a18" stroke-width="2"/>
  <rect x="122" y="183" width="12" height="30" rx="3" fill="#6b4423"/>
  <circle cx="128" cy="219" r="9" fill="#d9b44a" stroke="#7a5a18" stroke-width="2"/>
  </g>
</svg>
